name: Update exchange rates

on:
  schedule:
    # Weekdays 06:00 UTC = 10:00 Mauritius time (BoM publishes in the morning)
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

concurrency:
  group: rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Fails (and GitHub emails you) if BoM changed its page, fewer than 10
      # currencies parse, or a rate moved >10 %. The published file is left as is.
      - run: npm run rates
      - id: commit
        name: Commit rates.json if it changed
        run: |
          if git diff --quiet -- public/rates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Rates unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/rates.json
            git commit -m "Update exchange rates $(jq -r .bomDate public/rates.json)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
    permissions:
      contents: read
      pages: write
      id-token: write
